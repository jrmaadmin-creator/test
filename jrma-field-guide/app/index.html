<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>JRMA Field Guide</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-row">
      <button id="ptBtn" class="pt" type="button" aria-label="Patient details">
        <span id="ptLine" class="pt-line">New call</span>
        <span id="ptSub" class="pt-sub">Tap to add age and complaint</span>
      </button>
      <button id="cprBtn" class="cpr-top" type="button">CPR</button>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings"></button>
    </div>
    <div class="appbar-row chips">
      <span class="chip clock" title="Time since patient contact"><span id="clockIcon"></span><span id="elapsed">00:00</span></span>
      <button id="reassessBtn" class="chip reassess" type="button" hidden><span id="reassessIcon"></span>Reassess <b id="reassessLeft"></b></button>
      <span id="levelChip" class="chip level"></span>
    </div>
  </header>
  <div id="flags" class="flags" aria-live="polite"></div>
  <main id="view"></main>
  <nav class="tabs" aria-label="Sections"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="sheet" class="sheet-wrap" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
