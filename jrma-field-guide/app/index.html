<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>JRMA Field Guide</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="clock"><span id="elapsed">00:00</span><small>on call</small></div>
    <div class="top-actions"><button id="cprBtn" class="cpr-top" type="button">CPR</button><button id="reassessBtn" class="reassess" type="button">Reassess <span id="reassessLeft"></span></button></div>
  </header>
  <div id="flags" class="flags" aria-live="polite"></div>
  <main id="view"></main>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="call">Call</button>
    <button data-tab="protocol">Proto</button>
    <button data-tab="vitals">Vitals</button>
    <button data-tab="history">Hx</button>
    <button data-tab="report">Report</button>
    <button data-tab="peds">Meds</button>
    <button data-tab="prearrival">To ED</button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
